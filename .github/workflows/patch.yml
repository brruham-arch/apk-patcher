name: Patch SAMP APK - Frida Gadget

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zipalign apksigner aapt unzip python3 xz-utils

      - name: Download apktool
        run: |
          curl -L -o /usr/local/bin/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar"
          echo '#!/bin/bash' > /usr/local/bin/apktool
          echo 'java -jar /usr/local/bin/apktool.jar "$@"' >> /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool

      - name: Download Frida Gadget (armeabi-v7a)
        run: |
          FRIDA_VER=$(curl -s https://api.github.com/repos/frida/frida/releases/latest \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "Frida version: $FRIDA_VER"
          curl -L -o frida-gadget.so.xz \
            "https://github.com/frida/frida/releases/download/${FRIDA_VER}/frida-gadget-${FRIDA_VER}-android-arm.so.xz"
          xz -d frida-gadget.so.xz
          mv frida-gadget.so libfrida-gadget.so

      - name: Decompile APK
        run: |
          apktool d input/target.apk -o decompiled -f

      - name: Inject loadLibrary ke SplashActivity
        run: |
          python3 << 'PYTHON'
          import os

          target = "decompiled/smali/com/sampmobilerp/launcher/SplashActivity.smali"

          if not os.path.exists(target):
              print(f"ERROR: {target} tidak ditemukan!")
              exit(1)

          with open(target, 'r') as f:
              content = f.read()

          # Inject tepat setelah invoke-super onCreate yang spesifik ini
          SUPER_LINE = "    invoke-super {p0, p1}, Landroidx/fragment/app/v;->onCreate(Landroid/os/Bundle;)V"
          INJECT = (
              "\n"
              "    # >>> Frida Gadget injection <<<\n"
              '    const-string v0, "frida-gadget"\n'
              "    invoke-static {v0}, Ljava/lang/System;->loadLibrary(Ljava/lang/String;)V\n"
              "    # >>> End injection <<<\n"
          )

          if SUPER_LINE not in content:
              print("ERROR: invoke-super target tidak ditemukan di smali!")
              print("Coba cari manual...")
              # Fallback: cari invoke-super onCreate apapun
              import re
              matches = re.findall(r'    invoke-super.*->onCreate.*', content)
              print(f"invoke-super onCreate yang ada: {matches}")
              exit(1)

          if 'frida-gadget' in content:
              print("WARNING: frida-gadget sudah ada di smali, skip inject")
          else:
              new_content = content.replace(SUPER_LINE, SUPER_LINE + INJECT, 1)
              with open(target, 'w') as f:
                  f.write(new_content)
              print(f"[+] Inject berhasil setelah invoke-super onCreate!")

          # Verifikasi
          with open(target, 'r') as f:
              verify = f.read()
          if 'frida-gadget' in verify:
              print("[+] Verifikasi OK!")
          else:
              print("[-] Verifikasi GAGAL!")
              exit(1)
          PYTHON

      - name: Copy Frida Gadget ke lib
        run: |
          mkdir -p decompiled/lib/armeabi-v7a
          cp libfrida-gadget.so decompiled/lib/armeabi-v7a/libfrida-gadget.so
          ls -la decompiled/lib/armeabi-v7a/

      - name: Setup Frida config
        run: |
          MODE=$(cat config/mode.txt | tr -d '[:space:]')
          echo "Mode: $MODE"
          if [ "$MODE" = "script" ]; then
            cp config/frida_script.json decompiled/lib/armeabi-v7a/libfrida-gadget.config.so
            cp config/default_script.js  decompiled/lib/armeabi-v7a/libfrida-gadget.config.so.js
            echo "Script mode aktif"
          else
            cp config/frida_listen.json decompiled/lib/armeabi-v7a/libfrida-gadget.config.so
            echo "Listen mode aktif port 27042"
          fi

      - name: Preview hasil inject
        run: |
          echo "=== Sekitar inject point ==="
          grep -n -A 5 "frida-gadget" \
            decompiled/smali/com/sampmobilerp/launcher/SplashActivity.smali

      - name: Recompile APK
        run: |
          apktool b decompiled -o patched_unsigned.apk
          echo "Recompile: $(du -sh patched_unsigned.apk)"

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore test.keystore -alias testkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass testpass -keypass testpass \
            -dname "CN=Test,OU=Test,O=Test,L=Test,S=Test,C=US"

      - name: Zipalign + Sign
        run: |
          zipalign -v 4 patched_unsigned.apk patched_aligned.apk
          apksigner sign \
            --ks test.keystore --ks-key-alias testkey \
            --ks-pass pass:testpass --key-pass pass:testpass \
            --out patched_signed.apk patched_aligned.apk
          echo "Signed: $(du -sh patched_signed.apk)"

      - name: Verify APK
        run: |
          apksigner verify patched_signed.apk && echo "[+] APK valid!" || echo "[-] invalid"

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: samp-frida-patched
          path: patched_signed.apk
          retention-days: 7

      - name: Upload SplashActivity smali (debug)
        uses: actions/upload-artifact@v4
        with:
          name: SplashActivity-smali
          path: decompiled/smali/com/sampmobilerp/launcher/SplashActivity.smali
          retention-days: 3
